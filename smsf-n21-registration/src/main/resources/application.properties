spring.application.name=smsf-n21-registration
# No SBI listener: this module only consumes Kafka and calls the UDM.
spring.main.web-application-type=none
# Without an HTTP server there is no non-daemon thread of our own, and with no gateway configured
# yet there is no Kafka listener either — the JVM would have nothing left to run and would exit
# seconds after starting. This keeps the process alive, waiting for a gateway to arrive over the
# management websocket. The other SMSC modules get this for free from their embedded server; these
# two consumers do not expose HTTP and must not open a port just to stay up.
spring.main.keep-alive=true

# =====================================================
# Redis (cluster)
# Read-only: the HTTP/2 gateway registry and the UDM-audience token published by smsf-core.
# =====================================================
redis.cluster.nodes=localhost:7000,localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005
redis.threadPool.maxTotal=20
redis.threadPool.maxIdle=20
redis.threadPool.minIdle=1
redis.threadPool.blockWhenExhausted=true
redis.connection.timeout=2000
redis.so.timeout=2000
redis.maxAttempts=20
redis.connection.user=
redis.connection.password=

# Connect to a single Redis instance instead of a cluster. When true, only the first entry of
# redis.cluster.nodes is used, as the host:port of that instance.
redis.standalone.enabled=false

# =====================================================
# Kafka (consumer only: <networkId>.smsf.udm.register)
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.concurrency=1
kafka.consumer.register.max-poll-records=100

#Websocket
websocket.server.enabled=true
websocket.server.host=localhost
websocket.server.port=8081
websocket.server.path=/ws
websocket.retry.intervalSeconds=10
websocket.header.name=Authorization
websocket.header.value=fcb13146-ecd7-46a5-b9cb-a1e75fae9bdc

# =====================================================
# Security
# The token is minted by smsf-core and read from Redis. Treat it as unusable this many seconds
# before it expires, so a request is not sent with a credential that dies in flight.
# =====================================================
smsf.security.outbound-token.refresh-margin-seconds=30
# How often Redis is re-checked for the UDM token. A gateway that requires OAuth2 does not start its
# registration consumer until the token is there, so this is also the recovery latency.
smsf.security.outbound-token.redis-check-interval-seconds=10
# How often Redis is re-read once the rotation is due but has not landed (between
# expiresAt - margin and expiresAt). Short so the new token is picked up as soon as it is published.
smsf.security.outbound-token.stale-poll-interval-ms=100

# =====================================================
# N21 towards the UDM (Nudm_UECM, TS 29.503)
# UDM discovery via the NRF (Nnrf_NFDiscovery, TS 29.510). Discovery still runs from this module:
# Redis carries the token, not the discovery result.
# =====================================================
smsf.n21.discovery.cache-ttl-seconds=300
# Adds supi/routing-indicator/group-id selectors so the NRF returns the UDM serving the UE.
smsf.n21.discovery.subscriber-aware=true
# Upper bound on UDM endpoints kept connected when different UEs resolve to different instances.
smsf.n21.discovery.max-endpoints=4
smsf.n21.restart-min-interval-seconds=30
# Home PLMN reported when the AMF sends no GUAMI. Leave empty to drop the registration instead.
smsf.n21.home-plmn.mcc=
smsf.n21.home-plmn.mnc=
