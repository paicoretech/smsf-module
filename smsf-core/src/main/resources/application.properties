spring.application.name=smsf-core
spring.main.web-application-type=reactive
server.port=9070

server.http2.enabled=true

# SBI server (Nsmsf_SMService producer)
smsf.sbi.server.base-path=/nsmsf-sms/v2
smsf.sbi.public-address=127.0.0.1
smsf.sbi.server.apiroot=https://api.operator.com
smsf.sbi.http2.max-concurrent-streams=256
spring.webflux.base-path=${smsf.sbi.server.base-path}

# =====================================================
# Redis (cluster)
# Holds the HTTP/2 gateway registry and, written by this module, the NRF access tokens
# consumed by smsf-n21-registration and smsf-service-mt.
# =====================================================
redis.cluster.nodes=localhost:7000,localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005
redis.threadPool.maxTotal=20
redis.threadPool.maxIdle=20
redis.threadPool.minIdle=1
redis.threadPool.blockWhenExhausted=true
redis.connection.timeout=2000
redis.so.timeout=2000
redis.maxAttempts=20
redis.connection.user=
redis.connection.password=

# Connect to a single Redis instance instead of a cluster. When true, only the first entry of
# redis.cluster.nodes is used, as the host:port of that instance.
redis.standalone.enabled=false

# =====================================================
# Kafka (producer only: MO messages, delivery reports and registration events)
# =====================================================
spring.kafka.bootstrap-servers=localhost:9092
smsf.kafka.producer.linger-ms=0
smsf.kafka.producer.batch-size=16384
smsf.kafka.producer.compression-type=none
smsf.kafka.producer.enable-idempotence=true
smsf.kafka.producer.acks=all

# =====================================================
# Scylla (UE SMS context and MO multipart reassembly)
# =====================================================
scylla.contact.points=127.0.0.1:9042
scylla.datacenter=datacenter1
scylla.user=
scylla.password=

#Websocket
websocket.server.enabled=true
websocket.server.host=localhost
websocket.server.port=8081
websocket.server.path=/ws
websocket.retry.intervalSeconds=10
websocket.header.name=Authorization
websocket.header.value=fcb13146-ecd7-46a5-b9cb-a1e75fae9bdc

# =====================================================
# Security Layer (HTTP/2 SBI)
# =====================================================
smsf.security.enabled=true
smsf.security.bypass-paths=/actuator/**,/health,/info
smsf.security.expected-scope=nsmsf-sms
smsf.security.allowed-jws-algorithms=RS256,ES256
smsf.security.clock-skew-seconds=30
smsf.security.log-success=false

# JWKS cache
smsf.security.jwks.cache-ttl-seconds=600
smsf.security.jwks.cache-max-size=100
smsf.security.jwt.verification-cache-ttl-seconds=30
smsf.security.jwt.verification-cache-max-size=1000
smsf.security.jwks.fetch-timeout-ms=5000
smsf.security.jwks.fetch-retry-max=2

# Bearer extraction
smsf.security.bearer.header-name=Authorization
smsf.security.bearer.scheme=Bearer

# =====================================================
# TLS / mTLS
# Global SMSF server identity (key password + supported protocols,
# session cache, handshake timeout). Per-gateway trust material
# (CA chain, expected peer cert) is configured at runtime from the
# Http2Gateway DTO (incomingSecurity / outboundSecurity).
# Only this module exposes a TLS listener.
# =====================================================
smsf.tls.server.key-password=
smsf.tls.protocols=TLSv1.3,TLSv1.2
# Session resumption. Size this to the number of distinct peer connections expected within the
# timeout window: a peer that reconnects often resumes instead of paying a full handshake, which is
# what dominates CPU when connections are not reused.
smsf.tls.session-cache-size=1024
smsf.tls.session-timeout-seconds=300
smsf.tls.handshake-timeout-ms=10000

# Global TLS toggle for the SBI listener on server.port.
#   true  (default) -> HTTP/2 over TLS (TLS_H2) per 3GPP TS 33.501 §13.1
#   false            -> HTTP/2 cleartext (H2C) for local dev/testing only
smsf.tls.enabled=true

# =====================================================
# Outbound OAuth2 token refresh
# This module mints both audiences (AMF and UDM) and republishes them to Redis.
# =====================================================
smsf.security.outbound-token.refresh-margin-seconds=30
smsf.security.outbound-token.initial-fetch-timeout-seconds=10
smsf.security.outbound-token.retry-backoff-seconds=5

# =====================================================
# NRF registration (Nnrf_NFManagement, TS 29.510)
# =====================================================
smsf.nrf.api-full-version=2.0.0
smsf.nrf.heartbeat-default-seconds=60
smsf.nrf.initial-register-timeout-seconds=10
smsf.nrf.retry-backoff-seconds=5

# =====================================================
# N21 access-token audience
# The forwarding itself lives in smsf-n21-registration; this module only needs the scope so it
# can mint the UDM-audience token and publish it to Redis.
# =====================================================
smsf.n21.oauth2.scope=nudm-uecm

# =====================================================
# Multipart MO reassembly
# =====================================================
message.parts.ttl=30
message.parts.cache.ttl-grace-seconds=5
message.parts.cache.max-size=50000

# =====================================================

# applies the same mark on the response it gets.
# =====================================================
