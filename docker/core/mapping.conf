# Environment overrides accepted by the smsf-core image.
# Format: ENV_VAR_NAME|property.key

# APP
SPRING_APPLICATION_NAME|spring.application.name
SPRING_MAIN_WEB_APPLICATION_TYPE|spring.main.web-application-type

# SERVER
SERVER_PORT|server.port
SERVER_HTTP2_ENABLED|server.http2.enabled

# SBI SERVER (Nsmsf_SMService producer)
SMSF_SBI_SERVER_BASE_PATH|smsf.sbi.server.base-path
SMSF_SBI_SERVER_APIROOT|smsf.sbi.server.apiroot
SMSF_SBI_PUBLIC_ADDRESS|smsf.sbi.public-address
SMSF_SBI_HTTP2_MAX_CONCURRENT_STREAMS|smsf.sbi.http2.max-concurrent-streams

# KAFKA PRODUCER (throughput knobs; acks is forced to "all" while idempotence is enabled)
SMSF_KAFKA_PRODUCER_LINGER_MS|smsf.kafka.producer.linger-ms
SMSF_KAFKA_PRODUCER_BATCH_SIZE|smsf.kafka.producer.batch-size
SMSF_KAFKA_PRODUCER_COMPRESSION_TYPE|smsf.kafka.producer.compression-type
SMSF_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE|smsf.kafka.producer.enable-idempotence
SMSF_KAFKA_PRODUCER_ACKS|smsf.kafka.producer.acks

# REDIS
REDIS_CLUSTER_NODES|redis.cluster.nodes
REDIS_THREADPOOL_MAXTOTAL|redis.threadPool.maxTotal
REDIS_THREADPOOL_MAXIDLE|redis.threadPool.maxIdle
REDIS_THREADPOOL_MINIDLE|redis.threadPool.minIdle
REDIS_THREADPOOL_BLOCKWHENEXHAUSTED|redis.threadPool.blockWhenExhausted
REDIS_CONNECTION_TIMEOUT|redis.connection.timeout
REDIS_SO_TIMEOUT|redis.so.timeout
REDIS_MAX_ATTEMPTS|redis.maxAttempts
REDIS_CONNECTION_USER|redis.connection.user
REDIS_CONNECTION_PASSWORD|redis.connection.password
REDIS_STANDALONE_ENABLED|redis.standalone.enabled

# KAFKA (producer only)
KAFKA_BOOTSTRAP_SERVERS|spring.kafka.bootstrap-servers

# SCYLLA (UE SMS context and MO multipart reassembly)
SCYLLA_CONTACT_POINTS|scylla.contact.points
SCYLLA_DATACENTER|scylla.datacenter
SCYLLA_USER|scylla.user
SCYLLA_PASSWORD|scylla.password

# WEBSOCKET
WEBSOCKET_SERVER_ENABLED|websocket.server.enabled
WEBSOCKET_SERVER_HOST|websocket.server.host
WEBSOCKET_SERVER_PORT|websocket.server.port
WEBSOCKET_SERVER_PATH|websocket.server.path
WEBSOCKET_RETRY_INTERVAL_SECONDS|websocket.retry.intervalSeconds
WEBSOCKET_HEADER_NAME|websocket.header.name
WEBSOCKET_HEADER_VALUE|websocket.header.value

# SECURITY (HTTP/2 SBI)
SMSF_SECURITY_ENABLED|smsf.security.enabled
SMSF_SECURITY_BYPASS_PATHS|smsf.security.bypass-paths
SMSF_SECURITY_EXPECTED_SCOPE|smsf.security.expected-scope
SMSF_SECURITY_JWT_VERIFICATION_CACHE_TTL_SECONDS|smsf.security.jwt.verification-cache-ttl-seconds
SMSF_SECURITY_JWT_VERIFICATION_CACHE_MAX_SIZE|smsf.security.jwt.verification-cache-max-size
SMSF_SECURITY_ALLOWED_JWS_ALGORITHMS|smsf.security.allowed-jws-algorithms
SMSF_SECURITY_CLOCK_SKEW_SECONDS|smsf.security.clock-skew-seconds
SMSF_SECURITY_LOG_SUCCESS|smsf.security.log-success
SMSF_SECURITY_JWKS_CACHE_TTL_SECONDS|smsf.security.jwks.cache-ttl-seconds
SMSF_SECURITY_JWKS_CACHE_MAX_SIZE|smsf.security.jwks.cache-max-size
SMSF_SECURITY_JWKS_FETCH_TIMEOUT_MS|smsf.security.jwks.fetch-timeout-ms
SMSF_SECURITY_JWKS_FETCH_RETRY_MAX|smsf.security.jwks.fetch-retry-max
SMSF_SECURITY_BEARER_HEADER_NAME|smsf.security.bearer.header-name
SMSF_SECURITY_BEARER_SCHEME|smsf.security.bearer.scheme

# TLS / mTLS (only this module exposes a listener)
SMSF_TLS_ENABLED|smsf.tls.enabled
SMSF_TLS_SERVER_KEY_PASSWORD|smsf.tls.server.key-password
SMSF_TLS_PROTOCOLS|smsf.tls.protocols
SMSF_TLS_SESSION_CACHE_SIZE|smsf.tls.session-cache-size
SMSF_TLS_SESSION_TIMEOUT_SECONDS|smsf.tls.session-timeout-seconds
SMSF_TLS_HANDSHAKE_TIMEOUT_MS|smsf.tls.handshake-timeout-ms

# OUTBOUND OAUTH2 TOKEN REFRESH (published to Redis for the other two modules)
SMSF_SECURITY_OUTBOUND_TOKEN_REFRESH_MARGIN_SECONDS|smsf.security.outbound-token.refresh-margin-seconds
SMSF_SECURITY_OUTBOUND_TOKEN_INITIAL_FETCH_TIMEOUT_SECONDS|smsf.security.outbound-token.initial-fetch-timeout-seconds
SMSF_SECURITY_OUTBOUND_TOKEN_RETRY_BACKOFF_SECONDS|smsf.security.outbound-token.retry-backoff-seconds

# NRF REGISTRATION (Nnrf_NFManagement, TS 29.510)
SMSF_NRF_API_FULL_VERSION|smsf.nrf.api-full-version
SMSF_NRF_HEARTBEAT_DEFAULT_SECONDS|smsf.nrf.heartbeat-default-seconds
SMSF_NRF_INITIAL_REGISTER_TIMEOUT_SECONDS|smsf.nrf.initial-register-timeout-seconds
SMSF_NRF_RETRY_BACKOFF_SECONDS|smsf.nrf.retry-backoff-seconds

# N21 access-token audience (the forwarding itself lives in smsf-n21-registration)
SMSF_N21_OAUTH2_SCOPE|smsf.n21.oauth2.scope

# MULTIPART MO REASSEMBLY
MESSAGE_PARTS_TTL|message.parts.ttl
MESSAGE_PARTS_CACHE_TTL_GRACE_SECONDS|message.parts.cache.ttl-grace-seconds
MESSAGE_PARTS_CACHE_MAX_SIZE|message.parts.cache.max-size
