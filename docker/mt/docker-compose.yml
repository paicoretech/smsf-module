# smsf-service-mt — consumes the priority MT topics and delivers to the AMF.
#
# Depends on smsf-core only through Redis and Kafka: it reads the AMF-audience token that the core
# publishes. While no usable token is in Redis the priority consumers stay paused rather than
# sending unauthenticated requests to the AMF, and they resume on their own once one appears.
#
# Registry image on a real deployment:
#   paicbusinessdev/enterprise-smsf-service-mt:<version>   (main)
#   paicbusinessdev/technical-smsf-service-mt:<version>    (technical)
#   paicbusinessdev/qa-smsf-service-mt:<version>           (any other branch)

services:
  smsf-service-mt:
    image: paic/smsf-service-mt:latest
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000

    environment:
      # APP
      SPRING_APPLICATION_NAME: "smsf-service-mt"
      # JVM
      JVM_XMS: "-Xms512m"
      JVM_XMX: "-Xmx1024m"
      # REDIS (gateway registry and the AMF token published by smsf-core)
      REDIS_CLUSTER_NODES: "localhost:7000,localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005"
      REDIS_THREADPOOL_MAXTOTAL: "20"
      REDIS_THREADPOOL_MAXIDLE: "20"
      REDIS_THREADPOOL_MINIDLE: "1"
      REDIS_THREADPOOL_BLOCKWHENEXHAUSTED: "true"
      REDIS_CONNECTION_TIMEOUT: "2000"
      REDIS_SO_TIMEOUT: "2000"
      REDIS_MAX_ATTEMPTS: "20"
      REDIS_CONNECTION_USER: ""
      REDIS_CONNECTION_PASSWORD: ""
      # "true" for a single Redis instance: only the first entry of
      # REDIS_CLUSTER_NODES is used, as its host:port. Must match across the three modules.
      REDIS_STANDALONE_ENABLED: "false"
      # KAFKA CONFIG
      # Consumes <networkId>.smsf.sms.{high,medium,low}. The per-priority rate comes from the
      # gateway's messages_per_second_* values in Redis, not from here.
      KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
      KAFKA_MAX_POLL_RECORDS: "100"
      # SCYLLA CONFIG (DLR correlation and the pending-message buffer of the custom consumer)
      SCYLLA_CONTACT_POINTS: "localhost:9042"
      SCYLLA_DATACENTER: "datacenter1"
      SCYLLA_USER: ""
      SCYLLA_PASSWORD: ""
      # WEBSOCKET
      WEBSOCKET_SERVER_ENABLED: "true"
      WEBSOCKET_SERVER_HOST: "localhost"
      WEBSOCKET_SERVER_PORT: "9087"
      WEBSOCKET_SERVER_PATH: "/ws"
      WEBSOCKET_RETRY_INTERVAL_SECONDS: "10"
      WEBSOCKET_HEADER_NAME: "Authorization"
      WEBSOCKET_HEADER_VALUE: "fcb13146-ecd7-46a5-b9cb-a1e75fae9bdc"
      # SMSF LOGGING
      # Root log level; everything goes to stdout, collected with `docker logs`.
      SMSF_TRACE_LEVEL: "INFO"
      # SECURITY
      # The token is minted by smsf-core and read from Redis; this module never calls the NRF for
      # one. Keep the margin equal to the core's.
      SMSF_SECURITY_OUTBOUND_TOKEN_REFRESH_MARGIN_SECONDS: "30"
      # How often Redis is re-checked to pause or resume the priority consumers.
      SMSF_SECURITY_OUTBOUND_TOKEN_REDIS_CHECK_INTERVAL_SECONDS: "10"
      # Re-read interval while the rotation is due but has not landed yet.
      SMSF_SECURITY_OUTBOUND_TOKEN_STALE_POLL_INTERVAL_MS: "100"

      # How often the AMF link is checked once the stack is running. On a drop the MT consumers are
      # paused and the connection is retried at this same interval, so it also sets recovery speed.
      SMSF_MT_AMF_CONNECTION_CHECK_INTERVAL_SECONDS: "5"
      # SBI SERVER. The MT builds the n1n2FailureTxfNotifURI it hands the AMF from these two, so
      # they must be the same values smsf-core is serving on, or the AMF cannot report back.
      SMSF_SBI_SERVER_APIROOT: "https://api.operator.com"
      SMSF_SBI_SERVER_BASE_PATH: "/nsmsf-sms/v2"
      # How long a delivery the AMF accepted stays open waiting for the failure callback, when the
      # AMF reported no maxWaitingTime of its own. Capped by the validity the message has left.
      SMSF_MT_CORRELATION_DEFAULT_WAIT_SECONDS: "300"
      # JMX CONFIG
      ENABLE_JMX: "true"
      IP_JMX: "127.0.0.1"
      JMX_PORT: "9073"

    volumes:
      - /opt/paic/smsc-docker/smsf/conf/logback.xml:/opt/paic/SMSF_SERVICE_MT/conf/logback.xml
      # mTLS material towards the AMF, referenced by the Http2Gateway entries in Redis.
      - /opt/paic/smsc-docker/smsf/certs:/opt/paic/certs:ro
    network_mode: host
