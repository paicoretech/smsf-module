# Environment overrides accepted by the smsf-n21-registration image.
# Format: ENV_VAR_NAME|property.key

# APP
SPRING_APPLICATION_NAME|spring.application.name

# REDIS (gateway registry and the UDM token published by smsf-core)
REDIS_CLUSTER_NODES|redis.cluster.nodes
REDIS_THREADPOOL_MAXTOTAL|redis.threadPool.maxTotal
REDIS_THREADPOOL_MAXIDLE|redis.threadPool.maxIdle
REDIS_THREADPOOL_MINIDLE|redis.threadPool.minIdle
REDIS_THREADPOOL_BLOCKWHENEXHAUSTED|redis.threadPool.blockWhenExhausted
REDIS_CONNECTION_TIMEOUT|redis.connection.timeout
REDIS_SO_TIMEOUT|redis.so.timeout
REDIS_MAX_ATTEMPTS|redis.maxAttempts
REDIS_CONNECTION_USER|redis.connection.user
REDIS_CONNECTION_PASSWORD|redis.connection.password
REDIS_STANDALONE_ENABLED|redis.standalone.enabled

# KAFKA (consumer of <networkId>.smsf.udm.register)
KAFKA_BOOTSTRAP_SERVERS|spring.kafka.bootstrap-servers
KAFKA_LISTENER_CONCURRENCY|spring.kafka.listener.concurrency
KAFKA_CONSUMER_REGISTER_MAX_POLL_RECORDS|kafka.consumer.register.max-poll-records

# WEBSOCKET
WEBSOCKET_SERVER_ENABLED|websocket.server.enabled
WEBSOCKET_SERVER_HOST|websocket.server.host
WEBSOCKET_SERVER_PORT|websocket.server.port
WEBSOCKET_SERVER_PATH|websocket.server.path
WEBSOCKET_RETRY_INTERVAL_SECONDS|websocket.retry.intervalSeconds
WEBSOCKET_HEADER_NAME|websocket.header.name
WEBSOCKET_HEADER_VALUE|websocket.header.value

# SECURITY (the token is minted by smsf-core and read from Redis)
SMSF_SECURITY_OUTBOUND_TOKEN_REFRESH_MARGIN_SECONDS|smsf.security.outbound-token.refresh-margin-seconds
SMSF_SECURITY_OUTBOUND_TOKEN_REDIS_CHECK_INTERVAL_SECONDS|smsf.security.outbound-token.redis-check-interval-seconds
SMSF_SECURITY_OUTBOUND_TOKEN_STALE_POLL_INTERVAL_MS|smsf.security.outbound-token.stale-poll-interval-ms

# N21 TOWARDS THE UDM (Nudm_UECM, TS 29.503)
SMSF_N21_DISCOVERY_CACHE_TTL_SECONDS|smsf.n21.discovery.cache-ttl-seconds
SMSF_N21_DISCOVERY_SUBSCRIBER_AWARE|smsf.n21.discovery.subscriber-aware
SMSF_N21_DISCOVERY_MAX_ENDPOINTS|smsf.n21.discovery.max-endpoints
SMSF_N21_RESTART_MIN_INTERVAL_SECONDS|smsf.n21.restart-min-interval-seconds
SMSF_N21_HOME_PLMN_MCC|smsf.n21.home-plmn.mcc
SMSF_N21_HOME_PLMN_MNC|smsf.n21.home-plmn.mnc
